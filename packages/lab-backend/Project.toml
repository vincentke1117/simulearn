# LinearSolve 默认会加载 MKL_jll（再带上 IntelOpenMP_jll、oneTBB_jll）。这三个的二进制库都是「按需下载」的 artifact，
# PackageCompiler 不打进拓展包，程序一启动就去联网下载：断网的电脑上起不来，也违反约定「拓展不主动联网」
# （2026-11-02 打包后在隔离环境里实测）。电路内核解的都是小规模方程，用不上 MKL，关掉它；
# LinearSolve 是间接依赖，要列在 [extras] 里，这里的偏好才认得出是给它的。
[preferences.LinearSolve]
LoadMKL_JLL = false
